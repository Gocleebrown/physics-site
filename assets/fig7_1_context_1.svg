<svg viewBox="0 0 800 240" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="240" fill="white"/>

  <!-- ============ LEFT PANEL: VIEW FROM SIDE ============ -->
  <text x="110" y="20" font-size="13" font-weight="bold">view from side</text>

  <!-- ground -->
  <line x1="20" y1="190" x2="360" y2="190" stroke="black" stroke-width="1.5"/>
  <line x1="20" y1="190" x2="40" y2="200" stroke="black" stroke-width="1"/>
  <line x1="60" y1="190" x2="80" y2="200" stroke="black" stroke-width="1"/>
  <line x1="100" y1="190" x2="120" y2="200" stroke="black" stroke-width="1"/>
  <line x1="140" y1="190" x2="160" y2="200" stroke="black" stroke-width="1"/>

  <!-- simple side-view plane silhouette -->
  <ellipse cx="190" cy="100" rx="80" ry="9" fill="black"/>
  <polygon points="175,100 190,60 200,100" fill="black"/>
  <polygon points="255,100 275,85 275,100" fill="black"/>

  <!-- velocity arrow -->
  <line x1="120" y1="75" x2="165" y2="75" stroke="black" stroke-width="1.5"/>
  <polygon points="165,75 157,71 157,79" fill="black"/>
  <text x="118" y="67" font-size="13">v</text>

  <!-- vertical field arrow, plane to ground -->
  <line x1="190" y1="112" x2="190" y2="182" stroke="black" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="190,182 186,170 194,170" fill="black"/>
  <text x="196" y="150" font-size="12">vertical component</text>
  <text x="196" y="165" font-size="12">of Earth's field</text>

  <!-- ============ RIGHT PANEL: VIEW FROM ABOVE ============ -->
  <text x="530" y="20" font-size="13" font-weight="bold">view from above</text>

  <!-- fuselage -->
  <polygon points="710,110 685,102 540,104 520,110 540,116 685,118" fill="black"/>
  <!-- main wings (to wingtips P and Q) -->
  <polygon points="595,104 615,104 605,50" fill="black"/>
  <polygon points="595,116 615,116 605,170" fill="black"/>
  <!-- tail wings -->
  <polygon points="540,107 555,107 545,80" fill="black"/>
  <polygon points="540,113 555,113 545,140" fill="black"/>

  <circle cx="605" cy="50" r="3" fill="white" stroke="black"/>
  <text x="613" y="48" font-size="14">P</text>
  <circle cx="605" cy="170" r="3" fill="white" stroke="black"/>
  <text x="613" y="178" font-size="14">Q</text>

  <!-- velocity arrow -->
  <line x1="450" y1="90" x2="505" y2="90" stroke="black" stroke-width="1.5"/>
  <polygon points="505,90 497,86 497,94" fill="black"/>
  <text x="455" y="82" font-size="13">v</text>

  <!-- field into page symbol -->
  <circle cx="720" cy="55" r="12" fill="none" stroke="black" stroke-width="1.2"/>
  <line x1="712" y1="47" x2="728" y2="63" stroke="black" stroke-width="1.2"/>
  <line x1="728" y1="47" x2="712" y2="63" stroke="black" stroke-width="1.2"/>
  <text x="690" y="40" font-size="11">field into ground</text>

  <!-- wingspan label -->
  <line x1="630" y1="50" x2="630" y2="170" stroke="black" stroke-width="0.8" stroke-dasharray="3 2"/>
  <text x="635" y="115" font-size="12">wingspan</text>
</svg>
